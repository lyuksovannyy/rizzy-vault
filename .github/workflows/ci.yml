name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo lint
      # Crate-boundary and dependency rules (ADR 0016 §5, R1–R8; ADR 0009), including the
      # no-I/O crates' clippy.toml lists (R1, API side).
      - run: cargo xtask check-deps
      # clippy.toml entries clippy ignores ("found a module"), which `-D warnings` does not
      # catch (ADR 0016 §5). Reuses the results of `cargo lint` above.
      - run: cargo xtask check-clippy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  fuzz-check:
    name: fuzz targets build (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # fuzz/ is its own workspace (ADR 0016 §7), so no other job builds it. Type-checking the
      # targets on stable catches rizzy-core API drift on every PR; running them is the weekly
      # nightly job in fuzz.yml (ADR 0009 owner decision 4). libfuzzer-sys's build script needs
      # a C++ compiler, which the runner has.
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked --bins

  wasm:
    name: no-I/O crates and rizzy-wasm build for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo check-wasm

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      # fuzz/ has its own Cargo.lock, which the root check does not see. Same deny.toml (found
      # by walking up from fuzz/); its per-crate exception admits libfuzzer-sys's NCSA licence.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          arguments: --all-features

  web:
    name: web vault (wasm, pnpm, Vitest, Playwright)
    # M1 step 5 (ADR 0013 §4, ADR 0014 §3): build rizzy-wasm with the locked wasm-bindgen-cli
    # into packages/core, then the pnpm workspace's policy check, lint, build, unit tests, and
    # the Playwright tests in Chromium against the real rizzy-vault built with `embed-web`.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # packages/core's end-to-end test fails instead of skipping when no server binary exists.
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # pnpm at exactly the version in package.json's `packageManager` field, through Node's
      # own corepack (no third-party action).
      - run: corepack enable
      # wasm-bindgen-cli at exactly the `wasm-bindgen` version in Cargo.lock ("the two must
      # match", ADR 0013 §4; `cargo xtask build-wasm` refuses any other).
      - name: Install wasm-bindgen-cli (locked version)
        run: |
          version="$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install wasm-bindgen-cli --version "=$version" --locked
      - run: cargo xtask build-wasm
      # No dependency install scripts run (ADR 0014 §3; the allow-list is empty).
      - run: pnpm install --frozen-lockfile
      # Exact versions, pinned pnpm, empty install-script allow-list, deny.toml licences and
      # `pnpm audit` (ADR 0014 §3).
      - run: cargo xtask check-js
      - run: pnpm run lint
      - run: pnpm run build
      # The server packages/core's end-to-end test starts.
      - run: cargo build --locked -p rizzy-server --bin rizzy-vault
      - run: pnpm run test
      - run: pnpm --filter @rizzy-vault/web exec playwright install --with-deps chromium
      # Builds rizzy-vault with `embed-web` first, then runs Playwright against it.
      - run: pnpm run e2e

  bindings-baseline:
    name: wasm-bindgen expansion baseline (ADR 0019 §4.1)
    # Regenerates the macro expansion of rizzy-wasm and fails on any difference from the
    # committed crates/rizzy-wasm/generated/ (ADR 0019 §4.1: "CI regenerates and fails on any
    # difference"). `-Zunpretty=expanded` needs unstable flags; this job runs the pinned
    # toolchain with RUSTC_BOOTSTRAP=1, the toolchain the baseline was made with (recorded in
    # counts.txt). Only this job sets it; no build artefact of it is used anywhere else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - name: Regenerate and compare the expansion
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo xtask expand-bindings

  dco:
    name: DCO sign-off
    # ADR 0017 §4: the commits a pull request adds must be signed off, and the squash commit a
    # merge pushes to `main` must keep the trailers. The two need different rules (see
    # crates/xtask/src/signoff.rs, "Squash mode"), so each event runs its own step. A manual
    # run has no range.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history, so that both ends of the range are present.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      # Every PR commit needs a `Signed-off-by:` trailer with its author's name and email
      # (DCO 1.1, ADR 0017 Decision 4). The check is Rust (crates/xtask/src/signoff.rs); the
      # revisions reach it through the environment, never spliced into the script.
      - name: Check that every PR commit is signed off by its author
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask check-signoff "$BASE_SHA..$HEAD_SHA"
      # GitHub writes the squash commit (its author is the merger, its sign-offs sit in the
      # body), so on `main` the check only requires that each pushed commit kept at least one
      # well-formed `Signed-off-by:` line anywhere in its message. The per-author rule ran on
      # the PR before the merge.
      - name: Check that the commits pushed to main kept their sign-offs
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: cargo xtask check-signoff --squash "$BEFORE_SHA..$AFTER_SHA"

  image:
    name: container image (${{ matrix.platform }})
    # deploy/Containerfile for both architectures the operator guide supports (ADR 0010 §4,
    # docs/self-hosting.md §2). Build only: nothing is pushed and no credential is used. Each
    # architecture builds natively on its own runner, as the Containerfile expects, instead of
    # under QEMU emulation, which would take hours for a Rust release build.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build deploy/Containerfile
        env:
          PLATFORM: ${{ matrix.platform }}
        run: docker build --platform "$PLATFORM" -f deploy/Containerfile -t localhost/rizzy-vault:ci .

  # ---- Image publishing: DISABLED unless the owner turns it on --------------------------------
  #
  # The two jobs below push `ghcr.io/<owner>/<repo>:sha-<commit>` (a multi-arch index over
  # `...-amd64` and `...-arm64`) after every check above passes on a push to `main`. They run
  # only when the repository variable `RIZZY_PUBLISH_IMAGE` is `true` (Settings → Secrets and
  # variables → Actions → Variables); by default it is unset and both jobs are skipped. They use
  # the workflow's own `GITHUB_TOKEN`, with `packages: write` granted to these two jobs alone,
  # and no other secret; pull requests never reach them. These images are unsigned development
  # builds, not a release channel: reproducible, signed images are M8 (ADR 0010 §4,
  # ROADMAP §4.9).
  image-publish:
    name: publish image (${{ matrix.arch }}, off by default)
    needs: [fmt, clippy, test, fuzz-check, wasm, docs, deny, dco, image, web, bindings-baseline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RIZZY_PUBLISH_IMAGE == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build deploy/Containerfile
        env:
          ARCH: ${{ matrix.arch }}
        run: docker build --platform "linux/$ARCH" -f deploy/Containerfile -t "$IMAGE" .
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: docker push "$IMAGE"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  image-manifest:
    name: publish multi-arch image index (off by default)
    needs: image-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RIZZY_PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Create the multi-arch index
        run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
