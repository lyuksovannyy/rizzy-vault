# cargo-deny policy — run with `cargo deny check`. CI fails on any error.
# Changing this file is a security decision: it needs a reason in the PR description.

[graph]
all-features = true

[advisories]
# RustSec advisory database. Every vulnerability advisory is an error; ignoring one needs an
# entry here with the advisory ID and a written reason.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2026-0387 (crypto-bigint: secret-dependent branches in subtraction, division and
    # Montgomery multiplication; patched in 0.7.6). Ignored for crypto-bigint 0.5.5 only; the 0.7
    # line we use through p256 0.14 is on 0.7.6.
    # - Reason: no 0.5.x release fixes it, and no stable opaque-ke drops elliptic-curve 0.13.
    # - Affected code path: opaque-ke =4.0.1 -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5.
    #   opaque-ke reaches elliptic-curve only from its generic NIST-curve key-exchange code
    #   (key_exchange/group/elliptic_curve.rs, key_exchange/sigma_i/ecdsa.rs), which is
    #   instantiated only for curve types. Our OPAQUE suite is Ristretto255 (rizzy-core
    #   opaque/ksf.rs: OprfCs = opaque_ke::Ristretto255), so no crypto-bigint 0.5 arithmetic is
    #   compiled into our code.
    # - Expiry: remove at the first stable opaque-ke release off elliptic-curve 0.13, and no
    #   later than M3. Owner decision 2026-10-24 ("you decide what's better in this case").
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only via opaque-ke 4.0.1's unused NIST-curve generics; Ristretto255 suite; remove at next opaque-ke release, by M3" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list is policy for future dependencies; not every entry is used yet.
unused-allowed-license = "allow"
# Permissive and weak-copyleft licenses compatible with shipping AGPL-3.0 binaries.
# No GPL, LGPL or AGPL: a third-party crate under one of them needs a per-crate `exceptions`
# entry, added by an ADR 0017 amendment, and must never be reachable from an app-store client
# build (ADR 0017 owner decision 6). Our own crates need none: `[licenses.private]` skips them.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
exceptions = [
  # Owner decision 2026-09-26. libfuzzer-sys is "(MIT OR Apache-2.0) AND NCSA": LLVM's libFuzzer
  # sources are under the permissive NCSA licence. It is reachable only from fuzz/, its own
  # workspace that never ships, so NCSA is allowed for this crate alone and nowhere else. The
  # root `cargo deny check` warns that it was not encountered; that is expected.
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
# Our own workspace crates are `publish = false`; their license is set in Cargo.toml.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # TLS is rustls-only: static musl builds, no system OpenSSL in the container image.
  { crate = "openssl", wrappers = ["webauthn-attestation-ca", "webauthn-rs-core"], reason = "ADR 0009 owner decision 1, ADR 0059, ADR 0077 §1" },
  { crate = "openssl-sys", wrappers = ["openssl", "webauthn-attestation-ca", "webauthn-rs-core"], reason = "ADR 0009 owner decision 1, ADR 0059, ADR 0077 §1" },
  # Deprecated/unmaintained crypto-adjacent crates we never want pulled in.
  { crate = "rust-crypto", reason = "unmaintained; use RustCrypto crates" },
  { crate = "sodiumoxide", reason = "unmaintained; use RustCrypto crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
