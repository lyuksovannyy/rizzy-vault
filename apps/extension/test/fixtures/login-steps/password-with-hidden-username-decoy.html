<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password step with a hidden username decoy</title>
  </head>
  <body>
    <!-- Hostile: a visible password field whose only paired username candidates are
         invisible (opacity 0, zero size). A password-only step, never a fill into a decoy. -->
    <form id="login" action="/session" onsubmit="return false">
      <input id="opacity-decoy" type="text" autocomplete="username" style="opacity:0" />
      <input id="zero-decoy" type="text" autocomplete="username" style="width:0;height:0;border:0;padding:0" />
      <input id="pass" type="password" />
      <button type="submit">Log in</button>
    </form>
  </body>
</html>
