<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password in a cross-origin iframe</title>
  </head>
  <body>
    <!-- Hostile: the identifier is in the top frame, the password in a cross-origin iframe.
         The content script runs in the top frame only and never sees, tags or fills the
         iframe's field (INV-37, ADR 0037 §5). Step: username, the top-frame field only.
         The e2e server replaces the iframe src placeholder with a second, different origin. -->
    <form id="signin" action="/login">
      <label for="user">Email</label>
      <input id="user" type="email" autocomplete="username" />
      <button type="submit">Next</button>
    </form>
    <iframe id="pw-frame" src="__IFRAME_ORIGIN__/iframe-password.html" width="320" height="120"></iframe>
  </body>
</html>
