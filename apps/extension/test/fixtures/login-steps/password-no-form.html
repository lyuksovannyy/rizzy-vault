<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password field outside any form</title>
  </head>
  <body>
    <!-- Hostile-ish: a form-less page whose only text fields before the password are a search
         box and an unlabelled text field. Outside a form, an unsignalled field is never paired
         with the password. Step: password. -->
    <input id="search" type="search" name="q" placeholder="Search" />
    <input id="nick" type="text" />
    <input id="pass" type="password" />
    <button id="go">Go</button>
  </body>
</html>
