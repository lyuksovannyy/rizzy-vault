<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Identifier-first, step 2</title>
  </head>
  <body>
    <!-- Step 2 of the two-page sign-in: the password alone. The site repeats the username in a
         hidden field (a common pattern, and a decoy: it must never be filled). The visible
         username is plain text, not a field. Step: password. -->
    <form id="password" action="/session" onsubmit="return false">
      <p>Signing in as <span id="who">bob@example.com</span></p>
      <input id="hidden-user" name="username" type="email" autocomplete="username" style="display:none" />
      <label for="pass">Password</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
