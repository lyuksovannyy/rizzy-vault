<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cross-origin iframe document</title>
  </head>
  <body>
    <!-- The cross-origin iframe's own document (served from the second origin). -->
    <form id="pw" action="/session" onsubmit="return false">
      <input id="pass" type="password" autocomplete="current-password" />
    </form>
  </body>
</html>
