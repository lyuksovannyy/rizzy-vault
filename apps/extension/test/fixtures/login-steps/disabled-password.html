<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Disabled password, identifier enabled</title>
  </head>
  <body>
    <!-- The password field is visible but disabled until the username is entered: not a
         fill target, and a disabled field is not a concealed one either. The username has a
         strong signal. Step: username. -->
    <form id="signin" action="/login">
      <input id="user" type="email" autocomplete="username" />
      <input id="pass" type="password" disabled />
      <button type="submit">Next</button>
    </form>
  </body>
</html>
