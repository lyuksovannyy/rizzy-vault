<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password step with a read-only username</title>
  </head>
  <body>
    <!-- Step 2 shown with the username as a read-only field. Read-only fields are never fill
         targets. Step: password. -->
    <form id="password" action="/session" onsubmit="return false">
      <input id="user" type="email" autocomplete="username" value="bob@example.com" readonly />
      <input id="pass" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
