<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Passkey-ready identifier</title>
  </head>
  <body>
    <!-- An identifier field marked for conditional-mediation passkeys, with no form at all.
         Step: username (strong signal). -->
    <label for="user">Username</label>
    <input id="user" type="text" autocomplete="username webauthn" />
    <button id="continue">Continue</button>
  </body>
</html>
