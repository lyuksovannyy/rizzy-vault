<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Identifier step with hidden decoys</title>
  </head>
  <body>
    <!-- Hostile: two strongly signalled username fields the user cannot see (off-screen and
         hidden), ahead of the real one in document order. Only the visible field is offered.
         Step: username, the visible field. -->
    <form id="signin" action="/login">
      <input id="offscreen-decoy" type="text" autocomplete="username" style="position:absolute;left:-10000px;top:0" />
      <input id="hidden-decoy" type="text" autocomplete="username" hidden />
      <label for="user">Email</label>
      <input id="user" name="email" type="email" />
      <button type="submit">Next</button>
    </form>
  </body>
</html>
