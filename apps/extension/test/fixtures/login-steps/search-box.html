<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Search box</title>
  </head>
  <body>
    <!-- Not a login: a lone text field in a search form. No step. -->
    <form id="search" role="search" action="/search">
      <input id="q" name="q" type="text" placeholder="Search" />
      <button type="submit">Search</button>
    </form>
  </body>
</html>
