<!doctype html>
<!-- ADR 0076 §1.3–§1.4 fixture: card number and expiry -->
<html lang="en">
  <head><meta charset="utf-8" /><title>card number and expiry</title></head>
  <body>
    <form id="card" action="/verify">
      <input id="num" name="otp" type="text" autocomplete="cc-number" inputmode="numeric" maxlength="6" />
      <input id="exp" name="totp" type="text" autocomplete="cc-exp" inputmode="numeric" maxlength="6" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
