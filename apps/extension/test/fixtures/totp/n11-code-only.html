<!doctype html>
<!-- ADR 0076 §1.3–§1.4 fixture: a field whose only hint is code -->
<html lang="en">
  <head><meta charset="utf-8" /><title>a field whose only hint is code</title></head>
  <body>
    <form id="f" action="/verify">
      <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" placeholder="Code" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
