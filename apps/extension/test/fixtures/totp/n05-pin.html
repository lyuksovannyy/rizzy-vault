<!-- ADR 0076 §1.3–§1.4 fixture: PINs, incl. a 6-digit PIN code postal field and a password-type PIN -->
<html lang="en">
  <head><meta charset="utf-8" /><title>PINs, incl. a 6-digit PIN code postal field and a password-type PIN</title></head>
  <body>
    <form id="pin" action="/verify">
      <input id="pin" name="pin" type="tel" maxlength="4" placeholder="otp pin" />
      <input id="pincode" name="pin code" type="text" inputmode="numeric" maxlength="6" placeholder="One-time PIN code" />
      <input id="pwpin" name="otp" type="password" maxlength="6" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
