<!-- ADR 0076 §1.3–§1.4 fixture: username, password and a TOTP field on one form -->
<html lang="en">
  <head><meta charset="utf-8" /><title>username, password and a TOTP field on one form</title></head>
  <body>
    <form id="login" action="/login">
      <input id="user" name="username" type="text" autocomplete="username" />
      <input id="pass" name="password" type="password" autocomplete="current-password" />
      <input id="totp" name="otp" type="text" inputmode="numeric" maxlength="6" aria-label="2FA code" />
      <button type="submit">Log in</button>
    </form>
  </body>
</html>
