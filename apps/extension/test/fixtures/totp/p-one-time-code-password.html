<!-- ADR 0076 §1.3–§1.4 fixture: a password-type one-time-code is the TOTP target, never the password -->
<html lang="en">
  <head><meta charset="utf-8" /><title>a password-type one-time-code is the TOTP target, never the password</title></head>
  <body>
    <form id="mfa" action="/mfa">
      <input id="code" name="code" type="password" autocomplete="one-time-code" maxlength="6" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
