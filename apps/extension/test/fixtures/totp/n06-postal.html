<!-- ADR 0076 §1.3–§1.4 fixture: postal and ZIP codes -->
<html lang="en">
  <head><meta charset="utf-8" /><title>postal and ZIP codes</title></head>
  <body>
    <form id="addr" action="/verify">
      <input id="pc" name="otp" type="text" autocomplete="postal-code" inputmode="numeric" maxlength="6" />
      <input id="zip" name="zip_otp" type="text" inputmode="numeric" maxlength="6" />
      <input id="post" name="postcode" type="text" inputmode="numeric" maxlength="6" placeholder="one-time postcode" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
