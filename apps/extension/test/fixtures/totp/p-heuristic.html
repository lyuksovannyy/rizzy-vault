<!-- ADR 0076 §1.3–§1.4 fixture: no autocomplete, strict heuristic -->
<html lang="en">
  <head><meta charset="utf-8" /><title>no autocomplete, strict heuristic</title></head>
  <body>
    <form id="mfa" action="/session/mfa">
      <label for="otp">Enter the 6-digit code from your authenticator app</label>
      <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" />
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
