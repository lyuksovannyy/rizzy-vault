<!doctype html>
<!-- ADR 0076 §1.3–§1.4 fixture: phone numbers and tel-* tokens -->
<html lang="en">
  <head><meta charset="utf-8" /><title>phone numbers and tel-* tokens</title></head>
  <body>
    <form id="phone" action="/verify">
      <input id="tel" name="otp" type="tel" autocomplete="tel-national" maxlength="8" />
      <input id="mob" name="mobile_otp" type="tel" maxlength="8" />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
