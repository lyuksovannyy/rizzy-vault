<!doctype html>
<!-- ADR 0076 §1.3–§1.4 fixture: backup and recovery codes -->
<html lang="en">
  <head><meta charset="utf-8" /><title>backup and recovery codes</title></head>
  <body>
    <form id="b" action="/2fa">
      <input id="backup" name="backup_code" type="text" maxlength="8" inputmode="numeric" placeholder="2FA backup code" />
    </form>
    <form id="r" action="/2fa-recovery">
      <input id="recovery" name="mfa_recovery" type="text" maxlength="8" inputmode="numeric" />
    </form>
  </body>
</html>
