# cargo-fuzz targets for rizzy-vault's untrusted-input parsers (CRYPTO.md §15 item 7).
#
# Its own workspace, outside the main one (ADR 0016 §7): the main workspace never builds it, and
# `cargo deny`, `cargo lint` and `cargo test` at the root do not see it. It runs on nightly in a
# separate, scheduled, non-blocking CI job (ADR 0009 owner decision 4):
#
#     cargo +nightly fuzz run envelope_parse
#
# `cargo check` from this directory also works on the pinned stable toolchain; CI's `fuzz-check`
# job type-checks every target that way on each PR. The scheduled job (.github/workflows/
# fuzz.yml) runs every [[bin]] below for a bounded time each week and uploads crashing inputs.
#
# Targets and the CRYPTO.md §15 item 7 parsers they cover (each file's header says what it
# asserts):
#
#   envelope_parse     envelope parser (§9.5)
#   signed_statements  signature container and signed-statement parsers (§9.3, §9.6, §10.2)
#   secret_key_parse   Secret Key and recovery-code parsers (§7)
#   padding_unframe    Padmé frame parser (§8.5)
#   otpauth_uri        otpauth URI and Base32 secret parsers (§11.15)
#   opaque_server      server-side OPAQUE messages and stored state (§5)
#   export_fields      export-file header and `data` field decoders, and the server-secrets
#                      backup header (§11.14, §5.11); the Argon2id key is derived once per process
#   normalize          login-name and server-origin normalisers (§2); not in the §15 list
#   sync_types         sync-engine decoders: rizzy-sync's version-vector, dot and HLC decoders,
#                      and the HLC update rules (ADR 0012 §2-§3, ADR 0018 §3)
#   sync_header        op and snapshot header parsers (ADR 0012 §3), in rizzy-sync
#   record_op          item-record parsers (ADR 0018 §12): op data
#   record_snapshot    item-record parsers (ADR 0018 §12): live snapshot data
#   record_tombstone   item-record parsers (ADR 0018 §12): tombstone data
#   record_key         item-record parsers (ADR 0018 §12): the field-key grammar (§7) on the
#                      record layer's paths, which must agree with the rizzy-core parser they
#                      call (the one `item_key` fuzzes)
#   item_value         item value decoder (ADR 0018 §6, §10), with verbatim carrying and reading
#                      against every expected type
#   item_key           item field-key grammar (ADR 0018 §7, §10) and tag keys built on it
#   sync_compaction    rizzy-sync's compaction rules on a client's covered VV and on damaged rows
#                      (ADR 0021 §2-§4, §9)
#   sync_merge         rizzy-sync's per-item merge on records a faulty author can sign, in any
#                      order (ADR 0012 §4-§5, ADR 0018 §3, §10)
#   sync_causal        rizzy-sync's per-device-chain layer on served headers, covers and body
#                      verdicts: chain check, causal delivery, revocation, own-chain bookkeeping
#                      (ADR 0012 §4, §6, §7; ADR 0021 §4, §9)
#   proto_json         rizzy-proto's /api/v1 request and response types from arbitrary JSON, and
#                      the Rizzy-Client header parser (ADR 0002 point 3)
#   auth_rules         rizzy-domain-auth's rules on untrusted statements and transitions: the
#                      request-counter window, `account-state` steps, bundle-chain extension
#                      (CRYPTO.md §5.10, §10.2, §11; ADR 0012 §7)
#   webauthn_stored    rizzy-domain-auth's decoders of stored webauthn-rs JSON: the credential's
#                      SecurityKey and the ceremony state (ADR 0077 §§2, 4)
#   server_headers     rizzy-server's request-header parsers: bearer token, request-signing
#                      headers, Content-Length, Rizzy-Client, X-Forwarded-For (ADR 0028 items 4, 5,
#                      7, 11, 14; CRYPTO.md §5.10; threat model §7.6 "S")
#   server_config      rizzy-server's configuration file parser and validation (ADR 0010)
#   server_secrets_file rizzy-server's secrets file reader and writer (CRYPTO.md §5.11)
#   db_backup_parse    rizzy-storage's logical backup file parser and writer (ADR 0023 §3):
#                      arbitrary bytes, with and without a valid digest, and generated dumps
#                      round-tripped
#   db_backup_container rizzy-server's encrypted backup container, format version 2 (ADR 0071,
#                      CRYPTO.md §9.8): arbitrary bytes, with and without the magic and
#                      version, and sealed files mutated (flips, truncation, header edits)
#   client_export      rizzy-client's export-file JSON reader: the whole-file cap, the strict
#                      parser and the header checks (§11.14)
#   client_export_payload rizzy-client's export payload reader and the import mapping behind
#                      it: arbitrary bytes as the plaintext of an `EXPORT_FILE` envelope
#                      (ADR 0027 §2)
#   client_detect_format rizzy-client's import-format recognition: arbitrary bytes, and
#                      agreement with the encrypted export's strict reader
#   client_device_state rizzy-client's device-state record codec (ADR 0026 §2): arbitrary bytes,
#                      and the lifecycle steps on every record that parses
#   client_attachment_reassembly rizzy-client's attachment download (ADR 0054 §8): wraps,
#                      indices and chunk envelopes a hostile server serves; assembles only
#                      exactly every chunk in its place, byte for byte
#   client_cache_load  rizzy-client's cache loader (ADR 0026 §3-§6): the rows of a valid cache
#                      mutated in every column, then opened and loaded
#   client_account_settings rizzy-client's ACCOUNT_SETTINGS record parser and rizzy-match's
#                      matching section (ADR 0042 §2-§4): arbitrary bytes, one encoding per
#                      value, the bounds, and the host's edits on every record that parses
#   client_vault_directory rizzy-client's vault directory, ACCOUNT_SETTINGS tag 0x0002 (ADR 0081
#                      §A2): arbitrary bytes, one encoding per value, the shape, the host's
#                      edits, and the completeness check against any served set (INV-102)
#   import_bitwarden   rizzy-import's Bitwarden JSON importer and its JSON reader (ADR 0002
#                      point 2; threat model A16)
#   import_1pux        rizzy-import's 1PUX importer: the zip reader, the DEFLATE decoder and
#                      its size cap, the `export.data` mapping
#   import_keepass_xml rizzy-import's KeePass XML importer and its XML reader (no DTDs, no
#                      entities)
#   import_csv         rizzy-import's generic CSV importer and its CSV reader
#   import_chrome_csv  rizzy-import's Chrome CSV importer
#   import_firefox_csv rizzy-import's Firefox CSV importer
#   import_rizzy_json  rizzy-import's reader of rizzy-vault's own plaintext JSON export
#                      (ADR 0027 §6)
#   import_aliasvault_csv rizzy-import's AliasVault CSV importer and its CSV reader
#   import_aliasvault_avux rizzy-import's AliasVault .avux importer: the zip reader and the
#                      manifest.json mapping
#   import_cxf         rizzy-import's CXF (passkey) importer, for bare CXF files and the
#                      decrypted payload of our CXF export alike (ADR 0074 §3)
#   wasm_host_input    rizzy-wasm's readers of what JavaScript hands in: response status and
#                      body (`checkMeta`, `expectNoContent`), hex ids, item-draft entries, and
#                      the start of a login and a signup (ADR 0013 §3 rule 8)
#   generator_options  the password generator's options as JavaScript and rv pass them: rizzy-wasm's
#                      option readers, rizzy-core's character-set parser, option checks and
#                      generation (CRYPTO.md §12.1)
#   ca_pem             rv's private CA file reader (ADR 0030 Decision 4): the 64 KiB and
#                      16-certificate limits, PEM sections, trust-anchor parsing of arbitrary DER
#   url_normalize      rizzy-match's URL and bare-domain normalisers (ADR 0037 §2): never panic,
#                      idempotent on what they accept
#   equivalence_list   rizzy-match's signed equivalence-list parser (ADR 0038 §1): never panic
#                      on arbitrary bytes; a self-signed list round-trips through `verify`
#   passkey_ceremony   rizzy-client's WebAuthn passkey ceremonies (ADR 0039 §1, §2, §4): never
#                      panic on an attacker/relying-party-controlled origin, rpId or challenge;
#                      a created credential's assertion signature verifies under its own key
#   breach_range       the breach-check range response (CRYPTO.md §11.16, ADR 0053): rizzy-proto's
#                      bounded `SUFFIX:COUNT` parser on arbitrary bytes and JSON, and
#                      rizzy-client's constant-time verdict over what it accepts
#   identity_data      rizzy-client's identity data parser (ADR 0079 §5): never panic on
#                      arbitrary bytes; an accepted file generates for each of its countries
#   identity_options   the identity generator's options (ADR 0079 §3, OQ7): age text (preset,
#                      range, exact), email domain, country, and the tag 0x0004 defaults layout
#   passkey_pkcs8      rizzy-core's hand-written PKCS#8 reader and writers for CXF passkey keys
#                      (ADR 0074 §4): never panic; what parses writes back to a fixed point
#   icon_decode        the icons role's image path (ADR 0052 point 4, INV-76): rizzy-icon-proxy's
#                      decode-under-limits and PNG re-encode on arbitrary bytes (crafted and
#                      oversized headers, decompression bombs); output is a bounded 128×128 PNG
#   icon_discover      the icons role's page scan and URL resolution (ADR 0052 points 2–3): the
#                      bounded <link rel="icon"> scan and the Location/href resolver on arbitrary
#                      bytes; every accepted target is http(s), an RFC 1123 host, port 80 or 443
#
# The `import_*` targets share `fuzz_targets/import_common/mod.rs` (the checks on an import
# result and a counting RNG), included with `#[path]`; it is not a target.
#
# Not covered yet: the share-URL fragment parser (M5, not written).
[package]
name = "rizzy-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
# The traits the `opaque_server` target implements for its deterministic RNG. The version
# rizzy-core already pins ([workspace.dependencies], ADR 0009), so no new crate in this graph.
rand_core = { version = "=0.10.1", default-features = false }
rizzy-core = { path = "../crates/rizzy-core" }
# The sync engine's decoders and rules (`sync_types`, `sync_header`, the `record_*` targets,
# `sync_compaction`, `sync_merge` and `sync_causal`). A path crate whose only dependency is
# rizzy-core, so no new crate in this graph.
rizzy-sync = { path = "../crates/rizzy-sync" }
# The /api/v1 types (`proto_json`). A path crate with no internal dependency; its external
# crates (serde, base64ct, zeroize) are the ones the main workspace already locks.
rizzy-proto = { path = "../crates/rizzy-proto" }
# The traits `proto_json` is generic over, and the JSON parser the server and clients use on
# API bodies. The versions the main workspace locks.
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
# The auth domain's pure rules (`auth_rules`). A path crate; its external crates (sqlx, tokio and
# their trees) are the ones the main workspace already locks and `cargo deny` already checks.
rizzy-domain-auth = { path = "../crates/rizzy-domain-auth" }
# The server's parsers of untrusted input (`server_headers`, `server_config`,
# `server_secrets_file`). A path crate; its external crates (axum, hyper, tokio and their trees)
# are the ones the main workspace already locks and `cargo deny` already checks.
rizzy-server = { path = "../crates/rizzy-server" }
# The logical backup file's parser and writer and the table list (`db_backup_parse`). A path
# crate already in this graph through the two above; its external crates (sqlx, sha2) are the
# ones the main workspace already locks.
rizzy-storage = { path = "../crates/rizzy-storage" }
# The client flows' export readers (`client_export`, `client_export_payload`) and the WebAuthn
# passkey ceremonies (`passkey_ceremony`, ADR 0039). A path crate over rizzy-core, rizzy-sync,
# rizzy-proto, rizzy-import and rizzy-match, all already here; no new external crate.
rizzy-client = { path = "../crates/rizzy-client" }
# The importers (the `import_*` targets). A path crate whose only dependencies are rizzy-core
# and zeroize, so no new crate in this graph.
rizzy-import = { path = "../crates/rizzy-import" }
# The web vault's bindings (`wasm_host_input`). A path crate over rizzy-client; its external
# crates (wasm-bindgen and its macro crates, getrandom with `wasm_js`) are the ones the main
# workspace already locks and `cargo deny` already checks. Built for the host here.
rizzy-wasm = { path = "../crates/rizzy-wasm" }
# `rv`'s private CA file reader (`ca_pem`). A path crate over rizzy-client; its external crates
# (tokio-rustls, rustls, webpki-roots, hyper, sqlx with the SQLite driver, rustix) are the ones
# the main workspace already locks and `cargo deny` already checks.
rizzy-cli = { path = "../crates/rizzy-cli" }
# URL normalisation and the equivalence list (`url_normalize`, `equivalence_list`). A path
# crate over rizzy-core; its external crates (url, idna and the ICU4X stack, psl) are the ones
# the main workspace already locks and `cargo deny` already checks.
rizzy-match = { path = "../crates/rizzy-match" }
rizzy-icon-proxy = { path = "../crates/rizzy-icon-proxy" }

# One [[bin]] per target. `test`, `doc` and `bench` are off because a libFuzzer entry point
# (`#![no_main]` with `fuzz_target!`) is not a test, has no API to document and is not a benchmark.
