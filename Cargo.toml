[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz targets: their own workspace on the nightly toolchain (ADR 0016 §7, ADR 0009 owner
# decision 4), never built by the stable workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/lyuksovannyy/rizzy-vault"
publish = false

[workspace.dependencies]
rizzy-core = { path = "crates/rizzy-core" }
rizzy-proto = { path = "crates/rizzy-proto" }
rizzy-client = { path = "crates/rizzy-client" }
rizzy-bus = { path = "crates/rizzy-bus" }
rizzy-sync = { path = "crates/rizzy-sync" }
rizzy-storage = { path = "crates/rizzy-storage" }
rizzy-domain-auth = { path = "crates/rizzy-domain-auth" }
rizzy-domain-vault = { path = "crates/rizzy-domain-vault" }
rizzy-import = { path = "crates/rizzy-import" }
rizzy-match = { path = "crates/rizzy-match" }

# Cryptography. Exact pins and feature sets from ADR 0009 ("Allowed crate families" and
# "Required feature sets"); docs/CRYPTO.md §3. Bumps are reviewed like crypto changes and are
# never auto-merged. `default-features = false` everywhere: several defaults pull getrandom,
# which rizzy-core must never have in its dependency closure (ADR 0016 R1).
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
# `blake2` and `poly1305` are never called directly. They are declared only so that feature
# unification switches on their `zeroize` features, which `argon2` 0.6 and `chacha20poly1305`
# 0.11 do not forward (CRYPTO.md §12.2; ADR 0009, amendment of 2026-09-26).
blake2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
# Feature unification only; see `blake2` above.
poly1305 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
rand_core = { version = "=0.10.1", default-features = false }
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2_010 = { package = "sha2", version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

# URL parsing and matching for `rizzy-match` (ADR 0037, ADR 0038). Not cryptography: ordinary
# `cargo deny` review, not ADR 0009's checklist (ADR 0037 §2 point 1).
# - url: the WHATWG URL parser (ADR 0037 §2 point 1, "Open questions" recommendation accepted at
#   acceptance). `std` only (its own default); no `serde` (nothing here goes through serde,
#   CRYPTO.md §2). Pulls in `idna` (pinned below, matching feature set), `form_urlencoded` and
#   `percent-encoding`, both `alloc`-only, no further dependencies, no build script.
url = { version = "2.5.8", default-features = false, features = ["std"] }
# - idna: IDNA/punycode A-label processing (ADR 0037 §2 point 3). Exact pin: the ADR requires
#   "1.0 or later" for RUSTSEC-2024-0421, and a reviewed exact version keeps that floor from
#   drifting under caret resolution. `alloc` and `compiled_data` only (no build script; the
#   Unicode tables are compiled in through `idna_adapter`'s ICU4X backend, `icu_normalizer` and
#   `icu_properties` with their `_data` crates — Unicode-3.0, already allowed in `deny.toml`).
#   No `std`: `rizzy-match` is a no-I/O crate (ADR 0016 R1) and never needs it.
idna = { version = "=1.1.0", default-features = false, features = ["alloc", "compiled_data"] }
# - psl: the compiled-in Mozilla Public Suffix List snapshot (ADR 0037 §3; ADR 0016 §3's own
#   naming of this crate for `rizzy-match`). Exact pin, as ADR 0037 §3 requires: the crate ships
#   its PSL snapshot as Rust source compiled from `data/rules.txt` at publish time (no build
#   script, no runtime fetch), so the exact version pin here *is* the snapshot pin (ADR 0037 §3
#   assumes a separately hashed data file; `psl` has none to hash, see `rizzy-match`'s crate
#   docs for this reading). Version 2.1.240, fetched 2026-10-07 from crates.io
#   (https://github.com/addr-rs/psl), `MIT OR Apache-2.0`. `helpers` only, for `domain_str`/
#   `suffix_str`; depends only on `psl-types` (no further dependencies, `#![no_std]`,
#   `forbid(unsafe_code)`).
psl = { version = "=2.1.240", default-features = false, features = ["helpers"] }

# Wire types. Not cryptography.
# serde: the `/api/v1` request and response types of `rizzy-proto` (ADR 0002 point 3; ADR 0016
# §3 row "serde"). `std` and `derive` only; 1.0.229 is the version already in Cargo.lock through
# serde_json. Nothing signed or used as AAD goes through serde (CRYPTO.md §2).
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
# Server runtime (ADR 0010 §1: one binary on axum, tokio and sqlx; fact sheet: tokio 1.53.1).
# Server-side crates only; never a dependency of a no-I/O crate (ADR 0016 R1, checked by
# `cargo xtask check-deps`). Members switch on the features they need.
tokio = { version = "1.53.1", default-features = false }
# HTTP for the `api` and `web` roles (ADR 0010 §1: "one Rust binary on axum, tokio and sqlx";
# fact sheet: axum 0.8.9). `rizzy-server` only. Default features off; `http1` and `tokio` only:
# no `json`, `form` or `query` extractors (the server parses bodies itself with `serde_json`, with
# its own size limits and uniform errors), no `tracing`, no `http2`, no `ws`, no macros.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# hyper's HTTP/1 server connection, for `rizzy-server`'s own accept loop: `axum::serve` sets no
# hyper timer, so no header-read timeout, and cannot bound its shutdown drain (threat model
# §7.6 "D"). axum's `http1` and `tokio` features already pull both crates in with exactly these
# features; no new crate enters the graph. `rizzy-server` only.
hyper = { version = "1.11.1", default-features = false, features = ["http1", "server"] }
# `TokioIo`, `TokioTimer` (hyper's timer, needed for the header-read timeout) and
# `TowerToHyperService` (the axum router as a hyper service). Same versions and features as
# axum's own use; `rizzy-server` only.
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service"] }
# `ServiceExt::oneshot` for the in-process HTTP tests of `rizzy-server`. Already in the graph
# through axum, with the same `util` feature; dev-dependency only.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# OS randomness for the leaf crates only (ADR 0009 "Allowed crate families": `getrandom` 0.4,
# feature `sys_rng` for `SysRng`; ADR 0016 R2 (c)). The version already in Cargo.lock.
getrandom = { version = "0.4.3", default-features = false, features = ["sys_rng"] }
# Core-dump disabling at process start (threat model INV-60; ADR 0024): `setrlimit`/`getrlimit`
# of `RLIMIT_CORE` and, on Linux and Android, `PR_SET_DUMPABLE` through rustix's safe wrappers.
# Not cryptography. Exact pin, `default-features = false` (no `std`), feature `process` only
# (ADR 0024 point 1). Leaf crates only: `rizzy-server` and `rizzy-cli` in M1, later `rizzy-ffi`
# and `rizzy-ffi-cpp` (ADR 0024 point 2, checked by `cargo xtask check-deps`).
rustix = { version = "=1.1.5", default-features = false, features = ["process"] }
# The JavaScript bindings of the web vault's core (ADR 0013 §4 "Build"; ADR 0016 §3 row
# `rizzy-wasm`; ADR 0019 §4.1 "Pinned and vetted"). `rizzy-wasm` only: the R1 deny-list keeps it
# out of every no-I/O crate (`cargo xtask check-deps`). Exact pin: `wasm-bindgen-cli` must be
# exactly this version (ADR 0013 §4; `cargo xtask build-wasm` refuses any other), and every bump
# is a reviewed PR with the expansion-baseline diff and its `unsafe`/`extern`/`no_mangle`
# counts (ADR 0019 §4.1 (b), owner decision 7). 0.2.129 is the version ADR 0013 names (fact
# sheet 2026-09-25) and the newest on crates.io on 2026-10-01. Not cryptography. `std` only;
# no `serde-serialize` (bodies are serialised by `serde_json` in the crate, not through
# `JsValue`), no `enable-interning`, no `spans`.
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }

# Tooling and tests. Not cryptography.
# serde_json: `xtask` reads `cargo metadata` JSON with it (ADR 0016 §5), and `rizzy-core`'s tests
# read the committed known-answer vector files (CRYPTO.md §15 item 1). Never a normal or build
# dependency of a no-I/O crate; `rizzy-proto` uses it in tests only. `std` only.
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }

# Test-only. Never a normal or build dependency of a no-I/O crate (ADR 0016 R1).
# `chacha20` with `rng` provides the seeded ChaCha20Rng for test vectors (ADR 0009).
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }

# Server-side storage (ADR 0011 point 1, ADR 0010). Only `rizzy-storage` and the `rizzy-domain-*`
# crates depend on sqlx (ADR 0016 R5). Exact pin: INV-53 rests on sqlx 0.9's `SqlSafeStr` guard,
# so every sqlx upgrade is a reviewed change with both engines' suites (ADR 0011 point 2, Risks).
# Drivers: `sqlite-bundled` (the SQLite driver without extension loading, which the `sqlite`
# umbrella feature would add) and `postgres`; `runtime-tokio`; rustls with the ring provider and
# the webpki root set for PostgreSQL TLS (`sslmode=verify-full`). No `macros`, `any`, `json`:
# queries are runtime-checked and dispatched by enum (ADR 0011 point 3).
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres", "tls-rustls-ring-webpki", "migrate"] }

# The `rv` client's transport and cache (ADR 0013 §2: "The Rust HTTP client crate is chosen in
# M1. It must use rustls"; ADR 0026; ADR 0028). `rizzy-cli` only; never a dependency of a
# no-I/O crate (ADR 0016 R1, checked by `cargo xtask check-deps`).
#
# The HTTP client is hyper's own HTTP/1.1 client connection (`hyper` and `hyper-util` above,
# with hyper's `client` feature switched on by `rizzy-cli`): no new HTTP crate, and the same
# hyper the server is tested with. What it needs beside them:
# - http-body-util: `Full` and `Limited` bodies. Already in Cargo.lock through axum (hyperium,
#   MIT); no new crate enters the graph.
http-body-util = { version = "0.1.5", default-features = false }

# TLS for `https://` origins (ADR 0030 Decision 1, approved under ADR 0009's procedure on
# 2026-10-05; ADR 0009 "Amendments"; CRYPTO.md §3 "Transport (`rv`)"). `rizzy-cli` only, a leaf
# (ADR 0016 unchanged). Exact pins; bumps are reviewed like crypto changes and never
# auto-merged. TLS 1.3 only, with the `ring` provider passed explicitly, is set at run time in
# `crates/rizzy-cli/src/tls.rs`: a feature cannot keep TLS 1.2 out, because sqlx's
# `tls-rustls-ring-webpki` turns `rustls/tls12` on in a `--workspace` build.
# - tokio-rustls: the tokio adapter of rustls (the one new package in Cargo.lock). `ring` only;
#   never `aws_lc_rs`, `fips`, `early-data` or `logging`.
# - rustls: the TLS 1.3 client, declared directly so the pin holds (0.23.45 is the first release
#   fixed for RUSTSEC-2026-0285). `std` and `ring` only; never `aws_lc_rs`, `fips`.
# - webpki-roots: Mozilla's root set, compiled in; the default trust anchors. A private CA
#   file replaces them (`--ca-file`, `RIZZY_CLI_CA_FILE`; ADR 0030 Decision 4).
# Lockfile-pinned, transitive (already shipped with the server through sqlx): `ring` (≥ 0.17.12,
# RUSTSEC-2025-0009), `rustls-webpki` (≥ 0.103.13), `rustls-pki-types`, `untrusted`, and
# `getrandom` 0.2 (ring's OS RNG for the handshake only; our RNG stays `UnwrapErr(SysRng)`).
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
webpki-roots = { version = "=1.0.9", default-features = false }
# sqlx for a client leaf crate (ADR 0016 R5: "only with the `sqlite` driver and no other driver
# feature"; ADR 0019 §5; ADR 0026 §3). The same exact pin as `sqlx` above, without `postgres`,
# TLS and `migrate`: the cache schema is `rizzy-client`'s SQL text, run by the leaf.
sqlx-client = { package = "sqlx", version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# Every public item is documented; `cargo lint` (-D warnings) makes this a gate. Crate roots
# add clippy::missing_docs_in_private_items for internal logic outside test builds.
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"

# Argon2id at kdf_id 1 (64 MiB, t = 3, p = 4) takes many seconds unoptimised. Tests run it,
# so optimise the hash itself in dev and test builds. Release is unaffected.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Ed25519 and X25519 verification take milliseconds unoptimised, and the signature tests verify
# thousands of tampered statements. Optimise the curve and hash code in dev and test builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
