[package]
name = "rizzy-storage"
description = "rizzy-vault server storage: sqlx pools, migrations, the per-account lock, backup and restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sqlx.workspace = true
# SHA-256 of the logical backup file's trailing digest (ADR 0023 §2, §4): the version and
# features the ADR 0009 table pins (`=0.11.0`, `zeroize`), already in the graph through rizzy-core;
# no new crate.
sha2.workspace = true

[dev-dependencies]
# The integration tests drive sqlx on a current-thread runtime, with timeouts and sleeps.
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
