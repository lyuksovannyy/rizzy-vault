[package]
name = "xtask"
description = "Repository checks for rizzy-vault (ADR 0016 §5, ADR 0017 §4, ADR 0019 §4.1, ADR 0013 §4): `cargo xtask check-deps`, `check-clippy`, `check-signoff`, `expand-bindings`, `build-wasm`, `check-js`, `equivalence-list` (ADR 0038 §3). Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo metadata` JSON is read with serde_json's `Value`, without serde derive (ADR 0016 §5:
# "It parses the cargo metadata JSON with serde_json and stays small").
[dependencies]
serde_json.workspace = true
# `cargo xtask equivalence-list` (ADR 0038 §3): compiles the human-editable source into the
# canonical bytes (`rizzy-match`) and signs them with the owner's offline key, given as a raw
# 32-byte seed file (`rizzy-core`, `sign_detached`). Both already exist in the workspace for
# other members; `xtask` is a leaf/tool crate (ADR 0016 R6 "Tool"), so depending on them
# directly is unrestricted by R1.
rizzy-core.workspace = true
rizzy-match.workspace = true

[lints]
workspace = true
