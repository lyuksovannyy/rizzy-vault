[package]
name = "rizzy-match"
description = "URL normalisation, registrable-domain and match-mode decisions, and the signed equivalence list (ADR 0037, ADR 0038). No I/O; portable to wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rizzy-core.workspace = true
url.workspace = true
idna.workspace = true
psl.workspace = true

[dev-dependencies]
# Property tests: normalisation idempotence, and that every parser never panics on arbitrary
# bytes (ADR 0016 §4 "Dev-dependencies": R1's allow-list covers normal and build dependencies
# only, so tests may use proptest).
proptest.workspace = true
# Mints detached-signature test fixtures for `tests/inv39_equivalence_list_differential.rs`:
# not a new crate (already the ADR 0009-approved, workspace-pinned Ed25519 implementation
# `rizzy-core` itself uses), only extended to this crate's test code so it can sign its own
# generated lists the same way `cargo xtask equivalence-list` does, independent of
# `EquivalenceList::verify`'s own decision logic under test.
ed25519-dalek.workspace = true

[lints]
workspace = true
