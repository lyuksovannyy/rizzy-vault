[package]
name = "rizzy-client"
description = "Sans-I/O client flows of rizzy-vault: signup, login, unlock, device sessions, the sync driver, item edits, import, encrypted and plaintext export. No I/O; portable to wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# ADR 0016 §3 row `rizzy-client`: internal dependencies core, sync, proto, import, match.
# `rizzy-import` is a dependency since the import path and the plaintext export landed
# (ADR 0027): its items reach the vault through `items`, and the plaintext JSON writer shares
# its format constants and caps. `rizzy-match` lands with M2 (ADR 0037 "Every client ... calls
# the same `rizzy-match` functions through `rizzy-client`"; `cargo xtask check-deps` already
# allow-lists this edge). No external crate is added: `rand_core`, `subtle` and `zeroize` are
# the versions rizzy-core pins (ADR 0009), and they are already on the R1 allow-list this crate
# inherits from rizzy-core (`cargo xtask check-deps`).
[dependencies]
rand_core.workspace = true
rizzy-core.workspace = true
rizzy-import.workspace = true
rizzy-match.workspace = true
rizzy-proto.workspace = true
rizzy-sync.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The seeded ChaCha20Rng of the flow tests (ADR 0009: test-only). A dev-dependency only: R1's
# allow-list covers normal and build dependencies (ADR 0016 §4, "Dev-dependencies").
chacha20.workspace = true
# Round-trip and canonical-form properties of the device-state record (ADR 0026 §6). Test-only.
proptest.workspace = true
# Public-suffix lookup for `tests/inv64_rp_id_differential.rs`'s independent oracle (ADR 0037
# §3's own lookup, not a new crate: already a normal dependency of `rizzy-match`, pinned in
# `[workspace.dependencies]`; this only extends the existing, already-reviewed pin to test code
# in this crate too, for the same public-suffix lookup ADR 0039 §2 says INV-64 reuses).
psl.workspace = true
# The JSON bodies a transport would send for the fake server's requests and answers, which the
# INV-15 canary searches (`src/tests/canary.rs`). Test-only; the version every host and
# `rizzy-proto`'s tests already lock, so no new package.
serde_json.workspace = true

[lints]
workspace = true
